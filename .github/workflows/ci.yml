name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core app tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/core/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest
